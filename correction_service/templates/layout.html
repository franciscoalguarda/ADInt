<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Correction Service{% endblock %}</title>
    <style>
      body { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; font: 16px/1.5 system-ui, sans-serif; color: #20242a; }
      nav { display: flex; flex-wrap: wrap; gap: 1rem; padding-bottom: 1rem; border-bottom: 1px solid #ccd2da; }
      a { color: #0759a5; }
      form { display: grid; gap: .8rem; max-width: 36rem; }
      label { display: grid; gap: .25rem; }
      input, select, textarea, button { font: inherit; padding: .45rem .6rem; }
      button { width: fit-content; cursor: pointer; }
      table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
      th, td { text-align: left; border-bottom: 1px solid #ccd2da; padding: .6rem; }
      .success { background: #e7f6eb; padding: .7rem; }
      .error { background: #fde8e7; padding: .7rem; }
      .scan { display: block; width: 100%; max-width: 850px; border: 1px solid #ccd2da; margin: 1rem 0; }
      .comment { white-space: pre-wrap; }
      .table-container { overflow-x: auto; }
    </style>
    {% block page_styles %}{% endblock %}
  </head>
  <body class="{% block body_class %}{% endblock %}">
    <header><h1>Correction Service</h1></header>
    <nav aria-label="Main navigation">
      <a href="{{ url_for('index') }}">Home</a>
      <a href="{{ url_for('assignments') }}">Professor assignments</a>
      <a href="{{ url_for('upload_scan') }}">Upload scan</a>
      <a href="{{ url_for('pending_answers') }}">Answers to correct</a>
      <a href="{{ url_for('corrected_answers') }}">Corrected answers</a>
      <a href="{{ url_for('scans') }}">Scans and corrections</a>
    </nav>
    <main>
      {% if error %}
        <p class="error" role="alert">{{ error }}</p>
      {% endif %}
      {% if success %}
        <p class="success" role="status">{{ success }}</p>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
