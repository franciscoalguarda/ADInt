
{% extends 'layout.html' %}
{% block title %}Add user — User Service{% endblock %}

{% block content %}
    <h2>Add user</h2>

    <form method="post" action="{{ url_for('add_user') }}">
        <label for="id">Identifier
            <input type="number" id="id" name="id" min="1" max="9223372036854775807" required value="{{ request.form.get('id', '') }}">
        </label>

        <label for="name">Name
            <input type="text" id="name" name="name" autocomplete="name" required value="{{ request.form.get('name', '') }}">
        </label>

        <label for="password">Password
            <input type="password" id="password" name="password" autocomplete="new-password" required>
        </label>

        <fieldset aria-describedby="roles-help">
            <legend>Roles</legend>
            <p id="roles-help">Select at least one role.</p>
            {% for role in roles %}
                <label class="checkbox">
                    <input type="checkbox" name="role" value="{{ role }}"
                           {% if role in request.form.getlist('role') %}checked{% endif %}>
                    {{ role }}
                </label>
            {% endfor %}
        </fieldset>

        <button type="submit">Add user</button>
    </form>

{% endblock %}
