<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}User Service{% endblock %}</title>
    <style>
      :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; }
      body { max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #20242a; }
      header, nav, main { margin-bottom: 1.5rem; }
      nav { display: flex; flex-wrap: wrap; gap: 1rem; border-bottom: 1px solid #ccd2da; padding-bottom: 1rem; }
      a { color: #0759a5; }
      form { display: grid; gap: .8rem; max-width: 34rem; }
      label { display: grid; gap: .25rem; }
      input, button { font: inherit; padding: .45rem .6rem; }
      input { min-width: 0; }
      button { width: fit-content; cursor: pointer; }
      fieldset { display: grid; gap: .5rem; min-width: 0; border: 1px solid #ccd2da; padding: .8rem; }
      fieldset p { margin: 0; }
      .checkbox { display: flex; align-items: center; gap: .5rem; }
      .checkbox input { margin: 0; }
      table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
      th, td { border-bottom: 1px solid #ccd2da; padding: .6rem; text-align: left; }
      .table-container { overflow-x: auto; }
      .message { padding: .7rem; border-radius: .25rem; }
      .success { background: #e7f6eb; }
      .error { background: #fde8e7; }
      pre { overflow-x: auto; padding: .8rem; background: #f5f7fa; }
    </style>
  </head>
  <body>
    <header><h1>User Service</h1></header>
    <nav aria-label="Main navigation">
      <a href="{{ url_for('index') }}">Home</a>
      <a href="{{ url_for('list_users') }}">Users</a>
      <a href="{{ url_for('add_user') }}">Add user</a>
      <a href="{{ url_for('bulk_add_users') }}">Bulk add users</a>
    </nav>
    <main>
        {% for category, message in get_flashed_messages(with_categories=true) %}
            <p class="message {{ category }}" role="status">{{ message }}</p>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
  </body>
</html>
